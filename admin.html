<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ee0101"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><title>Administrador | Projeto Funcionários</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><script type="module">import {protegerPagina} from './js/page-auth.js'; await protegerPagina({perfis:['administrador'],destino:'admin.html'});</script></head><body class="bg-light p-4"><main class="container home-shell"><section class="card home-hero"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3"><div><h1 class="h3 mb-1">Painel do Administrador</h1><p class="text-muted mb-0">Controle de setores, perfis e visão geral da empresa.</p></div><div class="d-flex gap-2"><a href="acesso.html" class="btn btn-outline-secondary">Trocar acesso</a><button data-logout class="btn btn-outline-secondary">Sair</button></div></div></section><section class="row g-3"><div class="col-lg-6"><div class="card p-4 h-100"><h2 class="h5">Setores</h2><p class="text-muted">Os nove setores iniciais já ficam disponíveis para o sistema.</p><div class="input-group mb-3"><input id="novoSetor" class="form-control" placeholder="Novo setor"><button id="addSetor" class="btn btn-danger">Adicionar</button></div><div id="setores" class="list-group"></div></div></div><div class="col-lg-6"><div class="card p-4 h-100"><h2 class="h5">Perfis de acesso</h2><p class="text-muted">Crie no Firebase Authentication a conta do usuário e depois cadastre aqui o perfil e o setor dela.</p><div class="row g-2"><div class="col-md-6"><input id="uid" class="form-control" placeholder="UID do usuário"></div><div class="col-md-6"><input id="nome" class="form-control" placeholder="Nome"></div><div class="col-md-6"><input id="email" class="form-control" placeholder="E-mail"></div><div class="col-md-6"><select id="perfil" class="form-select"><option value="gestor">Gestor</option><option value="gerente_producao">Gerente de Produção</option><option value="rh">RH</option><option value="administrador">Administrador</option></select></div><div class="col-12"><select id="setor" class="form-select"><option>Carregando setores...</option></select></div><div class="col-12 form-check ms-2"><input id="ativo" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="ativo">Usuário ativo</label></div><div class="col-12"><button id="salvarUsuario" class="btn btn-primary">Salvar perfil</button></div></div><hr><div id="usuarios" class="list-group"></div></div></div></section></main><script type="module">
import {listarSetores,salvarSetor,listarPerfisUsuarios,salvarPerfilUsuario} from './js/access.js';
const $=id=>document.getElementById(id);let setores=[];
const PERFIL_LABEL={administrador:'Administrador',gestor:'Gestor',rh:'RH',gerente_producao:'Gerente de Produção'};async function render(){setores=await listarSetores();$('setores').innerHTML=setores.map(s=>`<div class="list-group-item d-flex justify-content-between"><span>${s.nome}</span><span class="badge text-bg-light">Ativo</span></div>`).join('');$('setor').innerHTML='<option value="">Selecione o setor</option>'+setores.map(s=>`<option>${s.nome}</option>`).join('');const us=await listarPerfisUsuarios();$('usuarios').innerHTML=us.map(u=>`<div class="list-group-item"><strong>${u.nome||'-'}</strong><div class="small text-muted">${u.email||'-'} · ${PERFIL_LABEL[u.perfil]||u.perfil||'-'} · ${u.setor||'Todos'}</div></div>`).join('')||'<div class="text-muted small">Nenhum perfil adicional cadastrado.</div>'}
$('addSetor').onclick=async()=>{const n=$('novoSetor').value.trim();if(!n)return;await salvarSetor(n);$('novoSetor').value='';await render()};$('salvarUsuario').onclick=async()=>{try{const uid=$('uid').value.trim();const perfil=$('perfil').value;const setor=(perfil==='administrador'||perfil==='rh'||perfil==='gerente_producao')?'Todos':$('setor').value;if(!uid)throw new Error('Informe o UID do usuário.');if(!setor)throw new Error('Selecione o setor do gestor.');await salvarPerfilUsuario(uid,{nome:$('nome').value.trim(),email:$('email').value.trim(),perfil,setor,ativo:$('ativo').checked});alert('Perfil salvo.');await render()}catch(e){alert(e.message)}};await render();
</script></body></html>
