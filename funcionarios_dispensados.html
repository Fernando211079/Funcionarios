<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ee0101"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <title>Funcionarios Dispensados | Indemetal Etiquetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
<script type="module">import { protegerPagina } from "./js/page-auth.js"; await protegerPagina({perfis:["administrador","gestor"],destino:"funcionarios_inicio.html"});</script></head>
<body class="bg-light p-4">
    <div class="container mb-3 app-topbar">
        <div class="d-flex justify-content-between align-items-center">
            <div class="app-brand">
                <div class="app-brand-mark">I</div>
                <div><div class="app-brand-title">Projeto Funcionários</div><div class="app-brand-subtitle">Indemetal Etiquetas · <span data-user-role>Gestão</span> · <span data-user-sector>Setor</span></div></div>
            </div>
            <a href="funcionarios_inicio.html" class="btn btn-sm btn-outline-secondary">Início</a>
        </div>
    </div>
    <div class="container">
        <div class="card shadow-sm p-4">
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Lista de Funcionarios Dispensados</h3>
                <a href="funcionarios_inicio.html" class="btn btn-outline-secondary">Voltar</a>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-danger">
                        <tr>
                            <th>Data Registro</th>
                            <th>No Registro</th>
                            <th>Funcionario</th>
                            <th>Telefone</th>
                            <th>Setor</th>
                            <th>Turno</th>
                            <th>Tempo na Empresa</th>
                            <th>Data Dispensa</th>
                            <th>Motivo da Dispensa</th>
                            <th>Acoes</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaDispensados"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            formatarDataBr,
            funcionarioDispensado,
            calcularTempoPermanencia
        } from "./js/app-utils.js";
        import { iniciarApp, listarFuncionarios } from "./js/firebase-db.js";

        async function carregarDispensados() {
            const funcionarios = await listarFuncionarios();
            const dispensados = funcionarios.filter(funcionarioDispensado);
            const tabela = document.getElementById("tabelaDispensados");
            tabela.innerHTML = "";

            if (dispensados.length === 0) {
                tabela.innerHTML = '<tr><td colspan="10" class="text-center text-muted">Nenhum funcionario dispensado cadastrado.</td></tr>';
                return;
            }

            dispensados.forEach((funcionario) => {
                const linha = document.createElement("tr");
                linha.innerHTML = `
                    <td>${formatarDataBr(funcionario.dataRegistro)}</td>
                    <td>${funcionario.numeroRegistro || "-"}</td>
                    <td>${funcionario.nomeFuncionario || "-"}</td>
                    <td>${funcionario.telefone || "-"}</td>
                    <td>${funcionario.setorTrabalho || "-"}</td>
                    <td>${funcionario.turnoTrabalho || "-"}</td>
                    <td>${calcularTempoPermanencia(funcionario.dataRegistro, funcionario.dataDispensa)}</td>
                    <td>${formatarDataBr(funcionario.dataDispensa)}</td>
                    <td>${funcionario.motivoDispensa || "-"}</td>
                    <td>
                        <a class="btn btn-sm btn-outline-dark" href="historico_funcionario.html?id=${funcionario.id}">Ficha</a>
                    </td>
                `;
                tabela.appendChild(linha);
            });
        }

        try {
            await iniciarApp();
            await carregarDispensados();
        } catch (erro) {
            alert(erro.message);
        }
    </script>
</body>
</html>
