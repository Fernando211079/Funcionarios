<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ee0101"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><title>Acesso | Projeto Funcionários</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/app.css"></head><body class="bg-light d-flex align-items-center justify-content-center p-3 login-page"><main class="card login-card p-4 p-md-5"><div class="app-brand justify-content-center mb-4"><div class="app-brand-mark">I</div><div><div class="app-brand-title fs-4">Projeto Funcionários</div><div class="app-brand-subtitle">Indemetal Etiquetas</div></div></div><h1 class="h4 text-center mb-1">Acesso ao sistema</h1><p class="text-muted text-center mb-4">Entre com seu usuário e senha.</p><form id="formLogin"><div class="mb-3"><label class="form-label">E-mail</label><input id="email" type="email" class="form-control" autocomplete="username" required></div><div class="mb-3"><label class="form-label">Senha</label><input id="senha" type="password" class="form-control" autocomplete="current-password" required></div><button class="btn btn-danger w-100" type="submit">Entrar</button><div id="erro" class="alert alert-danger mt-3 d-none"></div></form><div class="small text-muted mt-4">O acesso usa Firebase Authentication. O cadastro dos usuários é feito no Firebase Console.</div></main><script type="module">
import { entrar, observarSessao } from './js/auth.js';
const $=id=>document.getElementById(id); const params=new URLSearchParams(location.search); const redirect=params.get('redirect')||'acesso.html';
observarSessao(user=>{if(user) location.href=redirect.endsWith('.html')?redirect:'acesso.html'});
$('formLogin').onsubmit=async e=>{e.preventDefault();$('erro').classList.add('d-none');try{await entrar($('email').value.trim(),$('senha').value);location.href=redirect.endsWith('.html')?redirect:'acesso.html'}catch(err){$('erro').textContent='Não foi possível entrar. Confira o e-mail e a senha.';$('erro').classList.remove('d-none')}};
</script></body></html>
