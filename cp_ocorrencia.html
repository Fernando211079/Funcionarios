<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ee0101"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><title>CP de Ocorrência | Projeto Funcionários</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><script type="module">import { protegerPagina } from "./js/page-auth.js"; await protegerPagina({perfis:["administrador","gestor"],destino:"funcionarios_inicio.html"});</script></head><body class="bg-light p-4"><main class="container home-shell"><section class="card p-4 shadow-sm"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><h1 class="h3 mb-1">Comunicação de Pessoal</h1><p class="text-muted mb-0">CP de ocorrência — formulário integrado ao cadastro.</p></div><span class="badge text-bg-danger fs-6">CP Nº <span id="numeroCP">----</span></span></div><form id="formCP"><div class="row g-3"><div class="col-md-6"><label class="form-label">Funcionário</label><select id="funcionario" class="form-select" required><option value="">Carregando funcionários...</option></select></div><div class="col-md-2"><label class="form-label">Chapa</label><input id="chapa" class="form-control" readonly></div><div class="col-md-4"><label class="form-label">Setor</label><input id="setor" class="form-control" readonly></div><div class="col-12"><hr><h5>Tipo de comunicação</h5><div class="row g-2"><div class="col-md-4"><div class="form-check"><input id="advertir" class="form-check-input" type="checkbox"><label class="form-check-label" for="advertir">Advertir</label></div><div class="form-check"><input id="dispensar" class="form-check-input" type="checkbox"><label class="form-check-label" for="dispensar">Dispensar</label></div><div class="form-check"><input id="demissao" class="form-check-input" type="checkbox"><label class="form-check-label" for="demissao">Pedido de demissão</label></div></div><div class="col-md-4"><div class="form-check"><input id="suspender" class="form-check-input" type="checkbox"><label class="form-check-label" for="suspender">Suspender</label></div><input id="diasSuspensao" class="form-control mt-2" type="number" min="1" placeholder="Dias de suspensão"><input id="dataSuspensao" class="form-control mt-2" type="date"></div><div class="col-md-4"><div class="form-check"><input id="ferias" class="form-check-input" type="checkbox"><label class="form-check-label" for="ferias">Férias</label></div><input id="dataFerias" class="form-control mt-2" type="date"></div></div></div><div class="col-12"><hr><h5>Avaliação / Promoção</h5><div class="row g-2"><div class="col-md-3"><div class="form-check"><input id="promocao" class="form-check-input" type="checkbox"><label class="form-check-label" for="promocao">Promoção</label></div></div><div class="col-md-4"><input id="cargoA" class="form-control" placeholder="Cargo atual"></div><div class="col-md-5"><input id="cargoN" class="form-control" placeholder="Novo cargo"></div></div></div><div class="col-12"><label class="form-label">Motivo</label><textarea id="motivo" class="form-control" rows="5" required></textarea></div><div class="col-md-4"><label class="form-label">Data</label><input id="dataRef" class="form-control" type="date" required></div><div class="col-md-4"><label class="form-label">Encarregado</label><input id="gerente" class="form-control"></div><div class="col-md-4"><label class="form-label">RH</label><input id="rh" class="form-control"></div></div><div class="d-flex flex-wrap gap-2 mt-4"><button type="submit" class="btn btn-danger">Salvar</button><a href="cp_inicio.html" class="btn btn-secondary">Voltar</a></div><div class="alert alert-info py-2 mt-3 mb-0 small">Ao salvar, a CP fica registrada no histórico para consulta.</div><div id="status" class="small text-muted mt-3"></div></form></section></main><script type="module">
import { prepararCP, persistirCP, imprimirDocumento, formatarDataBR, blocoAcoesCP } from './js/cp-utils.js';
import { obterCP } from './js/firebase-db.js';
let funcionarios=[], numero='', salvoId='';
const $=id=>document.getElementById(id); const sel=$('funcionario');
function dataHoje(){return new Date().toISOString().slice(0,10)}
// Fonte única das seleções: usada tanto no documento impresso quanto no payload salvo.
function coletarAcoes(){return {advertir:$('advertir').checked,suspender:$('suspender').checked,diasSuspensao:$('diasSuspensao').value,dataSuspensao:$('dataSuspensao').value,dispensar:$('dispensar').checked,ferias:$('ferias').checked,dataFerias:$('dataFerias').value,demissao:$('demissao').checked,promocao:$('promocao').checked,cargoA:$('cargoA').value,cargoN:$('cargoN').value}}
function montarDocumento(){const f=funcionarios.find(x=>x.id===sel.value)||{}; return `<div class="top"><div><div class="title">EMPRESA</div><div>COMUNICAÇÃO DE PESSOAL</div></div><div><b>CP Nº:</b> ${numero}</div></div><div class="section"><div class="grid"><div><span class="label">Nome:</span> ${f.nomeFuncionario||''}</div><div><span class="label">Chapa:</span> ${f.numeroRegistro||''}</div><div><span class="label">Setor:</span> ${f.setorTrabalho||''}</div></div></div>${blocoAcoesCP({acoes:coletarAcoes()})}<div class="section"><b>Motivo:</b><br>${$('motivo').value.replace(/\n/g,'<br>')}</div><div class="section">Data: ${formatarDataBR($('dataRef').value)} &nbsp;&nbsp; Encarregado: ${$('gerente').value||''} &nbsp;&nbsp; RH: ${$('rh').value||''}</div><div class="sign"><div class="line">Encarregado</div><div class="line">Aprovação</div><div class="line">R.H.</div></div>`}
async function carregar(){try{const r=await prepararCP();funcionarios=r.funcionarios;sel.innerHTML='<option value="">Selecione um funcionário</option>'+funcionarios.map(f=>`<option value="${f.id}">${f.nomeFuncionario||'Sem nome'} — ${f.numeroRegistro||'sem REG'}</option>`).join('');numero='A DEFINIR';$('numeroCP').textContent=numero;$('dataRef').value=dataHoje();}catch(e){$('status').textContent='Erro: '+e.message}}
sel.addEventListener('change',()=>{const f=funcionarios.find(x=>x.id===sel.value);$('chapa').value=f?.numeroRegistro||'';$('setor').value=f?.setorTrabalho||''});
$('formCP').addEventListener('submit',async e=>{e.preventDefault();if(!sel.value){alert('Selecione o funcionário.');return}try{const f=funcionarios.find(x=>x.id===sel.value);salvoId=await persistirCP({tipo:'ocorrencia',funcionarioId:f.id,funcionarioNome:f.nomeFuncionario||'',chapa:f.numeroRegistro||'',setor:f.setorTrabalho||'',data:$('dataRef').value,acoes:coletarAcoes(),motivo:$('motivo').value,encarregado:$('gerente').value,rh:$('rh').value});const registro=await obterCP(salvoId);numero=registro?.numero||numero;$('numeroCP').textContent=numero;const msg=`CP Nº ${numero} salva com sucesso. Consulte no histórico quando precisar.`;$('status').textContent=msg;alert(msg);}catch(e){alert('Não foi possível salvar: '+e.message)}});
carregar();
</script></body></html>
