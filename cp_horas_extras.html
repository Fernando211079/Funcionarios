<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ee0101"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><title>Horas Extras | Projeto Funcionários</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><script type="module">import { protegerPagina } from "./js/page-auth.js"; await protegerPagina({perfis:["administrador","gestor"],destino:"funcionarios_inicio.html"});</script></head><body class="bg-light p-4"><main class="container home-shell"><section class="card p-4 shadow-sm"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><h1 class="h3 mb-1">Autorização para Realização de Horas Extras</h1><p class="text-muted mb-0">Modelo integrado ao cadastro de funcionários.</p></div><span class="badge text-bg-warning fs-6">Hora Extra</span></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Setor</label><input id="setor" class="form-control" value="" readonly><select id="setorSelect" class="form-select d-none"><option value="">Selecione o setor</option></select></div><div class="col-md-6"><label class="form-label">Data</label><input id="data" type="date" class="form-control"></div><div class="col-12"><label class="form-label">Motivo (justificar a necessidade)</label><textarea id="motivo" class="form-control" rows="3"></textarea></div><div class="col-12"><div class="d-flex justify-content-between align-items-center mb-2"><h5 class="mb-0">Funcionários</h5><button id="add" class="btn btn-sm btn-outline-warning">+ Adicionar funcionário</button></div><div class="table-responsive"><table class="table table-bordered align-middle" id="tabela"><thead><tr><th style="width:110px">REG</th><th>Nome</th><th style="width:150px">Horário</th><th>Observação</th><th style="width:60px"></th></tr></thead><tbody></tbody></table></div></div><div class="col-md-4"><label class="form-label">Solicitante</label><input id="solicitante" class="form-control"></div><div class="col-md-4"><label class="form-label">Aprovação</label><input id="aprovacao" class="form-control"></div><div class="col-md-4"><label class="form-label">R.H.</label><input id="rh" class="form-control"></div></div><div class="d-flex flex-wrap gap-2 mt-4"><button id="salvar" class="btn btn-warning">Salvar</button><a href="cp_inicio.html" class="btn btn-secondary">Voltar</a></div><div class="alert alert-info py-2 mt-3 mb-0 small">Ao salvar, a autorização fica registrada no histórico para consulta.</div><div id="status" class="small text-muted mt-3"></div></section></main><script type="module">
import { prepararCP, persistirCP, imprimirDocumento, formatarDataBR } from './js/cp-utils.js';
import { getPerfilAtual, listarSetores } from './js/access.js';
import { obterCP, listarFuncionarios } from './js/firebase-db.js';
let funcionarios=[], salvoId='', ehAdmin=false; const $=id=>document.getElementById(id); const tbody=$('tabela').querySelector('tbody');
// O Gestor tem setor fixo; Administrador/RH escolhem o setor da autorização.
const setorValor=()=>($('setorSelect').classList.contains('d-none')?$('setor').value:$('setorSelect').value).trim();
function hoje(){$('data').value=new Date().toISOString().slice(0,10)}
function addRow(f=''){const tr=document.createElement('tr');tr.innerHTML=`<td><input class="form-control reg" readonly></td><td><select class="form-select nome"><option value="">Selecionar funcionário</option>${funcionarios.map(x=>`<option value="${x.id}">${x.nomeFuncionario||'Sem nome'} — ${x.numeroRegistro||'sem REG'}</option>`).join('')}</select></td><td><input class="form-control horario" placeholder="Ex.: 18:00 às 20:00"></td><td><input class="form-control obs"></td><td><button class="btn btn-sm btn-outline-danger remover">×</button></td>`;tbody.appendChild(tr);const sel=tr.querySelector('.nome');sel.value=f;sel.onchange=()=>{const x=funcionarios.find(a=>a.id===sel.value);tr.querySelector('.reg').value=x?.numeroRegistro||''};tr.querySelector('.remover').onclick=()=>tr.remove();if(f)sel.onchange()}
function dados(){return [...tbody.querySelectorAll('tr')].map(tr=>({funcionarioId:tr.querySelector('.nome').value,reg:tr.querySelector('.reg').value,nome:tr.querySelector('.nome').selectedOptions[0]?.text.split(' — ')[0]||'',horario:tr.querySelector('.horario').value,observacao:tr.querySelector('.obs').value})).filter(x=>x.funcionarioId)}
function docHTML(){const rows=dados().map(x=>`<tr><td>${x.reg}</td><td>${x.nome}</td><td>${x.horario}</td><td>${x.observacao}</td></tr>`).join('');return `<div class="top"><div><div class="title">EMPRESA</div><div>AUTORIZAÇÃO PARA REALIZAÇÃO DE HORAS EXTRAS</div></div><div>SETOR: ${setorValor()}</div></div><div class="section"><b>DATA:</b> ${formatarDataBR($('data').value)}<br><b>MOTIVO (JUSTIFICAR A NECESSIDADE):</b><br>${$('motivo').value.replace(/\n/g,'<br>')}</div><div class="section"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="border:1px solid #777;padding:6px">REG</th><th style="border:1px solid #777;padding:6px">NOME</th><th style="border:1px solid #777;padding:6px">HORÁRIO</th><th style="border:1px solid #777;padding:6px">OBSERVAÇÃO</th></tr></thead><tbody>${rows}</tbody></table></div><div class="sign"><div class="line">${$('solicitante').value||'SOLICITANTE'}</div><div class="line">${$('aprovacao').value||'APROVAÇÃO'}</div><div class="line">${$('rh').value||'R.H.'}</div></div>`}
async function recarregarFuncionariosPorSetor(setor){
 $('status').textContent='Carregando funcionários...';
 try{
  const todos=await listarFuncionarios();
  const ativos=todos.filter(f=>String(f.status||f.situacao||'Ativo').toLowerCase()!=='dispensado');
  funcionarios=setor?ativos.filter(f=>(f.setorTrabalho||f.setor||'')=== setor):ativos;
  tbody.innerHTML='';addRow();$('status').textContent='';
 }catch(e){$('status').textContent='Erro ao carregar funcionários: '+e.message;}
}
async function init(){try{
  // Perfil único: o Gestor sempre escolhe o setor da autorização.
  const setores=await listarSetores();
  $('setor').classList.add('d-none');$('setorSelect').classList.remove('d-none');
  $('setorSelect').innerHTML='<option value="">Selecione o setor</option>'+setores.filter(s=>s.ativo!==false).map(s=>`<option>${s.nome}</option>`).join('');
  $('setorSelect').onchange=()=>recarregarFuncionariosPorSetor($('setorSelect').value);
  hoje();addRow();
 }catch(e){$('status').textContent='Erro: '+e.message;console.error(e)}};
$('add').onclick=()=>addRow();$('salvar').onclick=async()=>{const lista=dados();if(!lista.length){alert('Adicione pelo menos um funcionário.');return}if(!setorValor()){alert('Selecione o setor da autorização.');return}try{salvoId=await persistirCP({tipo:'horas_extras',setor:setorValor(),data:$('data').value,motivo:$('motivo').value,funcionarios:lista,solicitante:$('solicitante').value,aprovacao:$('aprovacao').value,rh:$('rh').value});const registro=await obterCP(salvoId);const msg=`Autorização Nº ${registro?.numero||''} salva com sucesso. Consulte no histórico quando precisar.`;$('status').textContent=msg;alert(msg)}catch(e){alert('Não foi possível salvar: '+e.message)}};init();
</script></body></html>
